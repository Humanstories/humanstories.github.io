<title>ประสบการณ์ | Human stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--card:#141416;--ink:#f6f3ee;--mute:#b3aca1;--line:#2b2b30;--accent:#ff9a1f;--accent2:#ff4d1a;--accent-ink:#1a0e00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Prompt",system-ui,"Noto Sans Thai",sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:20px 20px 48px;display:flex;flex-direction:column;align-items:center;gap:28px}
.logo{width:min(82vw,380px);height:auto;display:block}
.links{width:100%;display:grid;gap:12px}
.links a{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;color:var(--ink);text-decoration:none;font-weight:500;font-size:18px}
.links a span:last-child{color:var(--accent);font-size:15px}
.links a:hover,.links a:focus-visible{border-left-color:var(--accent2);outline:2px solid var(--accent);outline-offset:0}
.me{width:100%;max-width:440px;height:auto;display:block;margin-top:4px}
footer{text-align:center;color:var(--mute);font-size:14px;padding-bottom:24px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:999px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);font:600 16px "Prompt",sans-serif;cursor:pointer}
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.pn{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.pn h2{margin:0 0 14px;font-size:20px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.row input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0b0b0c;color:var(--ink);font:16px "Prompt",sans-serif;margin-bottom:6px}
.row .ctl{display:flex;flex-direction:column;gap:6px}
.btn{border:1px solid var(--line);background:#0b0b0c;color:var(--ink);border-radius:10px;padding:8px 12px;font:15px "Prompt",sans-serif;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.msg{margin:10px 0 0;color:var(--mute);font-size:14px}
@media (prefers-reduced-motion:no-preference){.links a{transition:border-color .15s}}
</style></head>

const imgs={};
const orig={logo:document.querySelector('.logo').src,me:document.querySelector('.me').src};
function pick(label,key,sel){
const inp=el('input',{type:'file',accept:'image/*'});inp.style.display='none';
const b=el('button',{className:'btn',textContent:label});b.onclick=()=>inp.click();
inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
try{const bmp=await createImageBitmap(f);const sc=Math.min(1,900/Math.max(bmp.width,bmp.height));
const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
const keep=f.type==='image/png'||f.type==='image/webp';
document.querySelector(sel).src=keep?c.toDataURL('image/png'):c.toDataURL('image/jpeg',0.86);
msg.textContent='เปลี่ยนรูปแล้ว กด "บันทึกและเผยแพร่" เพื่อใช้จริง'}catch(e){msg.textContent='ใช้ไฟล์นี้ไม่ได้ ลองรูปอื่น'}};
return el('span',{},b,inp)}
const pics=el('div',{className:'bt'},pick('เปลี่ยนโลโก้','logo','.logo'),pick('เปลี่ยนรูปของคุณ','me','.me'));
pn.append(el('h2',{textContent:'แก้ไขรูปและลิงก์'}),pics,el('p',{className:'msg',textContent:'รูปที่ตัดพื้นหลังแล้ว (ไฟล์ PNG โปร่งใส) จะแสดงเป็นตัวคนเดี่ยว ๆ'}),list,el('div',{className:'bt'},add),el('div',{className:'bt'},save,cancel),msg);
document.body.append(ov)}}
